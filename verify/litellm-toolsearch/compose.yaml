# LiteLLM Proxy v1.108.9。ホスト側の中継 (127.0.0.1:4101) に届くよう、ホストのネットワークをそのまま使う。
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.9
    network_mode: host
    command: ["--config", "/app/config.yaml", "--host", "127.0.0.1", "--port", "4000"]
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY を設定してください}
